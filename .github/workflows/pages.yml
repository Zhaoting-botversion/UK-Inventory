name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export static site
        run: python export_static.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for published artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          endpoint = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100")
          expected_id = int(os.environ['PAGES_ARTIFACT_ID'])
          for attempt in range(24):
              request = urllib.request.Request(endpoint, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Cache-Control': 'no-cache',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  artifacts = json.load(response)['artifacts']
              matches = [item for item in artifacts
                         if item['name'] == os.environ['PAGES_ARTIFACT_NAME'] and not item['expired']]
              if len(matches) == 1 and matches[0]['id'] == expected_id:
                  print(f'Confirmed Pages artifact {expected_id}')
                  break
              if len(matches) > 1:
                  raise SystemExit('Duplicate artifact name; refusing ambiguous deployment')
              print(f'Artifact metadata pending ({attempt + 1}/24)', flush=True)
              time.sleep(5)
          else:
              raise SystemExit('Uploaded artifact metadata did not become visible')
          PY
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
